<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean Boutique | Register</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body data-page="register">
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">
        <i class="fas fa-mug-hot"></i>
        <div class="brand-text">
          <h1>Bean Boutique</h1>
          <span>Fresh brews, warm moments</span>
        </div>
      </a>

      <nav class="simple-nav">
        <a href="index.html">Back to Home</a>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-section">
      <div class="auth-box reveal">
        <h2>Register</h2>

        <form class="auth-form" id="register-form" action="#" method="post" novalidate>
          <div>
            <label for="register-fullname">Full Name:</label>
            <input type="text" id="register-fullname" name="fullname" placeholder="Full Name" required>
          </div>
          <div><label for="register-email">Email:</label>
            <input type="email" id="register-email" name="email" placeholder="Email Address" required>
          </div>
          <div>
            <label for="register-password">Password</label>
            <input type="password" id="register-password" name="password" placeholder="Create Password" required
              minlength="6">
          </div>

          <div class="captcha-box">
            <div class="captcha-header">
              <h3>Human Verification</h3>
              <button type="button" id="refresh-captcha" class="captcha-refresh" aria-label="Refresh captcha">
                <i class="fas fa-rotate-right"></i>
              </button>
            </div>

            <div class="captcha-display-row">
              <div id="captcha-text" class="captcha-text"></div>
            </div>
            <label for="captcha-input">Enter Captcha</label>
            <input type="text" id="captcha-input" name="captcha-input" placeholder="Enter the captcha shown above"
              required>
            <p id="captcha-message" class="captcha-message"></p>
          </div>

          <p id="register-message" class="form-message"></p>

          <button type="submit" class="btn btn-primary full-width">Create Account</button>
        </form>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
